<!DOCTYPE html>
<html>
<head>
    <title>Job Tracker Debug Test</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <h1>Job Tracker Debug Test</h1>
    <div id="status">Initializing...</div>
    <div id="jobs"></div>
    
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBB_YUBIhS1CcbXNeD3rYGNToXFA3A9OL0",
            authDomain: "luminatoolkit.firebaseapp.com",
            projectId: "luminatoolkit",
            storageBucket: "luminatoolkit.firebasestorage.app",
            messagingSenderId: "492584336630",
            appId: "1:492584336630:web:509e7c7803298bc40d00d7"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        async function testJobTracker() {
            const statusDiv = document.getElementById('status');
            const jobsDiv = document.getElementById('jobs');
            
            try {
                // Check authentication
                const user = auth.currentUser;
                if (!user) {
                    statusDiv.innerHTML = '<p style="color: red;">❌ User not authenticated. Please sign in first.</p>';
                    return;
                }
                
                statusDiv.innerHTML = `<p>✅ User authenticated: ${user.email} (UID: ${user.uid})</p>`;
                
                // Query jobs for current user
                const jobsQuery = db.collection('jobs').where('userId', '==', user.uid);
                const snapshot = await jobsQuery.get();
                
                statusDiv.innerHTML += `<p>📊 Found ${snapshot.docs.length} job documents</p>`;
                
                if (snapshot.docs.length === 0) {
                    jobsDiv.innerHTML = '<p>No jobs found. Let\'s create a test job...</p>';
                    
                    // Create a test job
                    const testJob = {
                        company: 'Test Company',
                        role: 'Test Role',
                        status: 'applied',
                        date: new Date().toISOString().split('T')[0],
                        notes: 'Test job created via debug script',
                        userId: user.uid,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    };
                    
                    const docRef = await db.collection('jobs').add(testJob);
                    statusDiv.innerHTML += `<p>✅ Created test job with ID: ${docRef.id}</p>`;
                    
                    // Query again to verify
                    const newSnapshot = await jobsQuery.get();
                    statusDiv.innerHTML += `<p>📊 After creation: ${newSnapshot.docs.length} job documents</p>`;
                    
                    jobsDiv.innerHTML = '<h3>Jobs:</h3>' + 
                        newSnapshot.docs.map(doc => 
                            `<p><strong>${doc.data().company}</strong> - ${doc.data().role} (${doc.id})</p>`
                        ).join('');
                } else {
                    jobsDiv.innerHTML = '<h3>Jobs:</h3>' + 
                        snapshot.docs.map(doc => 
                            `<p><strong>${doc.data().company}</strong> - ${doc.data().role} (${doc.id})</p>`
                        ).join('');
                }
                
            } catch (error) {
                console.error('Test error:', error);
                statusDiv.innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
                statusDiv.innerHTML += `<p>Code: ${error.code}</p>`;
            }
        }

        // Sign in with Google (you'll need to handle redirect manually)
        function signIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(result => {
                console.log('Signed in:', result.user);
                testJobTracker();
            }).catch(error => {
                console.error('Sign in error:', error);
                document.getElementById('status').innerHTML = `<p style="color: red;">❌ Sign in failed: ${error.message}</p>`;
            });
        }

        // Auto-test if already signed in
        auth.onAuthStateChanged(user => {
            if (user) {
                testJobTracker();
            } else {
                document.getElementById('status').innerHTML = '<p>Not signed in. <button onclick="signIn()">Sign in with Google</button></p>';
            }
        });
    </script>
</body>
</html>
